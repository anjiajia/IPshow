name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lint with ruff (optional)
        run: |
          pip install ruff
          ruff check core.py app.py --ignore E501 || true

      - name: Verify files
        run: |
          ls -la
          ls -la tests/
          python -c "import core; print('core imported OK')"

      - name: Test with pytest
        run: |
          python -m pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ipshow:latest .

      - name: Test Docker image runs
        run: |
          docker run -d --name ipshow-test -p 8501:8501 ipshow:latest
          sleep 5
          curl -f http://localhost:8501/_stcore/health || exit 1
          docker stop ipshow-test
