name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lint with ruff (optional)
        run: |
          pip install ruff
          ruff check core.py app.py --ignore E501 || true

      - name: Test with pytest
        run: |
          python -m pytest tests/ -v --tb=short

  docker-build-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ipshow:latest .

      - name: Test Docker image runs
        run: |
          docker run -d --name ipshow-test -p 8501:8501 ipshow:latest
          sleep 5
          curl -f http://localhost:8501/_stcore/health || exit 1
          docker stop ipshow-test

  release:
    runs-on: ubuntu-latest
    needs: [test, docker-build-test]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ipshow:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/ipshow:latest

      - name: Check Docker Hub credentials
        id: check_dockerhub
        env:
          DH_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "$DH_USER" ]; then
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.check_dockerhub.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push to Docker Hub
        if: steps.check_dockerhub.outputs.has_dockerhub == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ipshow:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/ipshow:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          name: Release ${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
